# The tower's heartbeat: daily, plus a hand-crank for impatient days.
# Commits its own observations; the git history of state.json *is* the log.
name: watch

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python watch.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit what moved
        run: |
          git config user.name "standards-watch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "observe: $(date -u +%Y-%m-%d)"
          git push
